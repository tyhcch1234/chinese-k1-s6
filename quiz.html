<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>測驗 · 香港中文 K1–S6</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">香港中文 <span>K1–S6</span></a>
  <nav class="nav">
    <a href="index.html">課程</a>
    <a href="index.html#assess" class="on">測驗</a>
    <a href="index.html#about">依據</a>
  </nav>
</div></header>

<main class="wrap qwrap" id="app"></main>

<script src="assets/data/core.js"></script>
<script src="assets/data/k.js"></script>
<script src="assets/data/ks1.js"></script>
<script src="assets/data/ks2.js"></script>
<script src="assets/data/ks3.js"></script>
<script src="assets/data/ks4.js"></script>
<script src="assets/data/extra.js"></script>
<script src="assets/js/questions.js"></script>
<script>
(function(){
  function param(k){
    var m = new RegExp('[?&]'+k+'=([^&]+)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  var gid = param('g') || 'p1';
  var level = parseInt(param('level')||'1', 10);
  if([1,2,3].indexOf(level)<0) level = 1;
  var g = CN.byId(gid);
  var app = document.getElementById('app');
  if(!g){ app.innerHTML = '<p style="padding:40px 0">找不到這個年級。<a href="index.html">返回課程總覽</a></p>'; return; }
  var st = CN.stageOf(g);
  document.documentElement.style.setProperty('--c', st.color);
  var levelName = {1:'基礎',2:'進階',3:'挑戰'}[level];
  var TOTAL = CNQ.count(gid);

  var questions = CNQ.session(gid, level, 10);
  var idx = 0, answers = [], answered = false;

  if(!questions.length){
    app.innerHTML = '<p style="padding:40px 0">這一級暫時未有足夠題目。<a href="grade.html?g='+gid+'">返回年級頁</a></p>';
    return;
  }

  function speak(text){
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-HK'; u.rate = 0.82;
    speechSynthesis.speak(u);
  }
  function header(){
    return '<div class="crumb" style="margin-top:16px"><a href="index.html">課程總覽</a> ／ '
      + '<a href="grade.html?g='+gid+'">'+g.name+'</a> ／ 測驗 · '+levelName+'</div>';
  }

  function render(){
    var q = questions[idx];
    var pct = Math.round(idx/questions.length*100);
    app.innerHTML = header()
      + '<div class="qbar"><span>'+levelName+'</span><div class="progress"><i style="width:'+pct+'%"></i></div><span>'+(idx+1)+' / '+questions.length+'</span></div>'
      + '<div class="qcard">'
      + '<span class="qtag">'+q.tag+'</span>'
      + '<p class="qtext">'+q.q+'</p>'
      + (q.sub ? '<p class="qsub">'+q.sub+'</p>' : '')
      + (q.listen ? '<div style="margin-top:12px"><button class="btn ghost sm" id="play">▶ 播放語音</button> <span class="muted">（粵語語音；如無聲，可按此顯示文字）</span><p class="muted" id="shown" style="display:none;margin-top:8px">'+q.listen+'</p></div>' : '')
      + '<div class="opts" id="opts">'
      + q.opts.map(function(o,i){ return '<button class="opt" data-i="'+i+'"><span class="k">'+'ABCD'[i]+'</span><span>'+o+'</span></button>'; }).join('')
      + '</div>'
      + '<div class="fb" id="fb"></div>'
      + '<div class="qfoot"><button class="btn" id="next" disabled>下一題</button>'
      + '<a class="btn ghost sm" href="grade.html?g='+gid+'">離開</a></div>'
      + '</div>'
      + '<p class="muted" style="text-align:center;margin-top:14px">本年級題庫共 '+TOTAL+' 題，每次隨機抽 10 題 · <a href="bank.html?g='+gid+'">看全部題目</a></p>';

    if(q.listen){
      document.getElementById('play').addEventListener('click', function(e){
        e.preventDefault(); speak(q.listen);
        document.getElementById('shown').style.display = 'block';
      });
      setTimeout(function(){ speak(q.listen); }, 350);
    }
    document.getElementById('opts').addEventListener('click', function(e){
      var b = e.target.closest('.opt'); if(!b || answered) return;
      choose(parseInt(b.dataset.i,10));
    });
    document.getElementById('next').addEventListener('click', function(){
      if(idx < questions.length-1){ idx++; answered=false; render(); window.scrollTo({top:0,behavior:'smooth'}); }
      else finish();
    });
  }

  function choose(i){
    answered = true;
    var q = questions[idx];
    var ok = i === q.a;
    answers.push({q:q, picked:i, ok:ok});
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b, k){
      b.disabled = true;
      if(k===q.a) b.classList.add('right');
      if(k===i && !ok) b.classList.add('wrong');
    });
    var fb = document.getElementById('fb');
    fb.className = 'fb show ' + (ok?'ok':'no');
    fb.innerHTML = '<b>'+(ok?'答對了':'答錯了')+'</b>'+q.why;
    var nx = document.getElementById('next');
    nx.disabled = false;
    nx.textContent = idx < questions.length-1 ? '下一題' : '看成績';
  }

  function finish(){
    var right = answers.filter(function(a){return a.ok;}).length;
    var pctScore = Math.round(right/questions.length*100);
    var msg = pctScore>=90?'掌握得很好，可以挑戰下一個難度。'
      : pctScore>=70?'大致掌握，重看錯題後再試一次會更穩。'
      : pctScore>=50?'部分概念未清，建議先回到本年級的詞彙表與閱讀部分。'
      : '基礎未穩，先由本年級詞彙表開始，並做「基礎」測驗重練。';
    var review = answers.map(function(a,i){
      return '<div class="row"><div class="qn">第 '+(i+1)+' 題 · '+a.q.tag+'</div>'
        + '<div>'+a.q.q+(a.q.sub?'　<span class="muted">'+a.q.sub+'</span>':'')+'</div>'
        + '<div style="margin-top:3px"><span class="'+(a.ok?'ok':'no')+'">'+(a.ok?'✓ 正確':'✗ 你選：'+a.q.opts[a.picked])+'</span>'
        + (a.ok?'':'　正確答案：'+a.q.opts[a.q.a])+'</div>'
        + '<div class="muted" style="margin-top:2px">'+a.q.why+'</div></div>';
    }).join('');
    var nextLvl = level<3 ? '<a class="btn" href="quiz.html?g='+gid+'&level='+(level+1)+'">試「'+{2:'進階',3:'挑戰'}[level+1]+'」</a>' : '';
    app.innerHTML = header()
      + '<div class="qcard"><div class="result">'
      + '<div class="score">'+pctScore+'<small> 分</small></div>'
      + '<div class="msg">'+right+' / '+questions.length+' 題正確 · '+levelName+'<br>'+msg+'</div></div>'
      + '<div class="qfoot" style="justify-content:center;flex-wrap:wrap">'
      + '<button class="btn" id="again">再做一次</button>' + nextLvl
      + '<a class="btn ghost" href="bank.html?g='+gid+'">題庫</a>'
      + '<a class="btn ghost" href="grade.html?g='+gid+'">返回年級</a></div>'
      + '<div class="review"><h4 style="margin:22px 0 4px;font-size:14px;color:var(--sub)">逐題檢討</h4>'+review+'</div></div>';
    document.getElementById('again').addEventListener('click', function(){
      questions = CNQ.session(gid, level, 10); idx=0; answers=[]; answered=false; render(); window.scrollTo({top:0});
    });
  }

  render();
})();
</script>
</body>
</html>
