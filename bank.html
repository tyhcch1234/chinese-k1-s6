<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>題庫 · 香港中文 K1–S6</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .qfilter{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
  .qfilter button{font-family:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
  .qfilter button.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
  .qitem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:9px 0}
  .qitem .qh{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--sub);margin-bottom:4px}
  .qitem .qh b{color:var(--c);font-size:12px;background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:5px;padding:1px 7px;font-weight:600}
  .qitem .qq{font-size:15px;font-weight:600;line-height:1.65}
  .qitem .qs{font-size:13px;color:var(--sub);margin-top:3px}
  .qopts{display:grid;gap:5px;margin-top:9px;font-size:14px}
  .qopts div{padding:5px 9px;border-radius:8px;border:1px solid var(--line)}
  .qopts div.ans{border-color:var(--ok);background:#f1faf4;font-weight:600}
  .qwhy{display:none;margin-top:9px;font-size:13px;color:var(--ink2);background:#fafbfc;border-left:3px solid var(--c);border-radius:6px;padding:8px 11px}
  body.showans .qwhy{display:block}
  body.showans .qopts div.ans{box-shadow:inset 0 0 0 1px var(--ok)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html">香港中文 <span>K1–S6</span></a>
  <nav class="nav">
    <a href="index.html">課程</a>
    <a href="index.html#assess">測驗</a>
    <a href="index.html#about">依據</a>
  </nav>
</div></header>

<main class="wrap" id="app"></main>

<script src="assets/data/core.js"></script>
<script src="assets/data/k.js"></script>
<script src="assets/data/ks1.js"></script>
<script src="assets/data/ks2.js"></script>
<script src="assets/data/ks3.js"></script>
<script src="assets/data/ks4.js"></script>
<script src="assets/data/extra.js"></script>
<script src="assets/js/questions.js"></script>
<script>
(function(){
  function param(k){
    var m = new RegExp('[?&]'+k+'=([^&]+)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  var gid = param('g') || 'p1';
  var g = CN.byId(gid);
  var app = document.getElementById('app');
  if(!g){ app.innerHTML = '<p style="padding:40px 0">找不到這個年級。<a href="index.html">返回課程總覽</a></p>'; return; }
  var st = CN.stageOf(g);
  document.documentElement.style.setProperty('--c', st.color);
  var groups = CNQ.byType(gid);
  var total = CNQ.count(gid);
  var active = '全部';

  function render(){
    var list = active==='全部' ? groups : groups.filter(function(x){return x.tag===active;});
    var items = [];
    list.forEach(function(grp){ items = items.concat(grp.items); });

    var chips = ['全部'].concat(groups.map(function(x){ return x.tag; }));
    app.innerHTML = '<div class="crumb" style="margin-top:16px"><a href="index.html">課程總覽</a> ／ '
      + '<a href="grade.html?g='+gid+'">'+g.name+'</a> ／ 題庫</div>'
      + '<section class="ghead"><h1><em>'+g.name+'</em> 題庫</h1>'
      + '<p class="muted">共 <b>'+total+'</b> 題 · '+groups.length+' 類題型 · 依 '+st.range+' 程度編寫</p>'
      + '<div class="toolbar"><button class="btn sm" id="toggle">顯示答案</button>'
      + '<a class="btn ghost sm" href="quiz.html?g='+gid+'&level=1">開始測驗</a>'
      + '<a class="btn ghost sm" href="grade.html?g='+gid+'">返回年級</a></div></section>'
      + '<div class="qfilter" id="qf">' + chips.map(function(c){
          return '<button data-t="'+c+'" class="'+(c===active?'on':'')+'">'+c+(c==='全部'?'（'+total+'）':'（'+(groups.filter(function(x){return x.tag===c;})[0].items.length)+'）')+'</button>';
        }).join('') + '</div>'
      + '<div id="list">' + items.map(function(q, i){
          return '<div class="qitem"><div class="qh"><b>'+q.tag+'</b><span>第 '+(i+1)+' 題</span></div>'
            + '<div class="qq">'+q.q+'</div>'
            + (q.sub?'<div class="qs">'+q.sub+'</div>':'')
            + (q.listen?'<div class="qs">🔊 語音題：'+q.listen+'</div>':'')
            + '<div class="qopts">' + q.opts.map(function(o, k){
                return '<div class="'+(k===q.a?'ans':'')+'">'+'ABCD'[k]+'. '+o+'</div>';
              }).join('') + '</div>'
            + '<div class="qwhy"><b>答案：</b>'+'ABCD'[q.a]+'　'+q.why+'</div></div>';
        }).join('') + '</div>';

    document.getElementById('toggle').addEventListener('click', function(){
      document.body.classList.toggle('showans');
      this.textContent = document.body.classList.contains('showans') ? '隱藏答案' : '顯示答案';
    });
    document.getElementById('qf').addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      active = b.dataset.t; render(); window.scrollTo({top:0});
    });
  }
  render();
})();
</script>
</body>
</html>
